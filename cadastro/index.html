<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Criar conta</h2>
    </header>
    <nav>
        <a href="../login/index.html" id="link">Ja possui uma conta? Clique aqui para fazer o login.</a>
    </nav>
    <main>
        <form action="../login/index.html" class="cadastro">
            <h3>Informe seus dados</h3>
            
            <input type="text" required placeholder="Digite seu nome">
            
            <input type="email" required placeholder="Digite seu email">
            
            <input type="password" required placeholder="Crie uma senha (mínimo 8)">
            
            <input type="password" required placeholder="Confirme sua senha">
            
            <input type="text" required placeholder="Informe seu RG/CPF">
            
            <input type="text" required placeholder="Informe seu endereço">
            
            <input type="text" required placeholder="Informe sua cidade">
            
            <input type="text" required placeholder="Informe o Estado">
            
            <input type="text" required placeholder="Informe o país de origem">
            
            <label>Data de nascimento:</label>
            <input type="date">
            
            <button>Finalizar Cadastro</button>
        </form>
    </main>
</body>
</html>
