<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha.</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Esqueci minha senha.</h1>
    </header>
    <main>
        <form onsubmit="alert('Senha alterada')" action="../login/index.html">
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="Digite seu email">
            <br><br>
            <label for="password">Senha:</label>
            <input type="password" id="password" required placeholder="Digite a nova senha">
            <br><br>
            <label>Confirmação:</label>
            <input type="password" id="password" required placeholder="Confirme seua senha">
            <br><br>
            <button>Enviar nova senha</button>
        </form>
    </main>
</body>

</html>
